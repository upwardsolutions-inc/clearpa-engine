_format_version: "3.0"
_transform: true

services:
  - name: epa-backend-service
    url: http://host.docker.internal:8080
    routes:
      - name: epa-pas-submit-route
        paths:
          - /fhir/v1
        strip_path: false
        methods:
          - POST
          - GET
          - OPTIONS
    plugins:
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Gateway-Routed: Kong-DB-Less"